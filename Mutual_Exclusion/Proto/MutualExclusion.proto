syntax = "proto3";

option go_package = "example.com/Mutual_Exclusion/proto";

service TokenRing {
    rpc passToken(Token) returns (Ack); 
}

message Token {
    uint32 node_id = 1; 
}

message Ack {
    bool success = 1; 
}


